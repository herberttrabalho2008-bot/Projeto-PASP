<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#efeff1">
  <title>Nova palavra-passe · Gestão de Avarias</title>
  <link rel="icon" href="img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Montserrat:wght@600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="img/logo.jpg" alt="Agrupamento de Escolas de Lousada">
        <div>
          <h1>Gestão de Avarias</h1>
          <p>Agrupamento de Escolas de Lousada</p>
        </div>
      </div>
      <h2 class="section-title center">Nova palavra-passe</h2>

      <div id="sem-token" class="auth-form" hidden>
        <div id="sem-token-msg" class="alert alert-erro" role="alert">O link de recuperação é inválido. Peça um novo.</div>
        <a class="btn btn-secondary btn-block" href="recuperar-password.html">Pedir novo link</a>
      </div>

      <form id="form" class="auth-form" novalidate hidden>
        <div id="erro" role="alert"></div>
        <div class="field">
          <label class="label" for="pw">Nova palavra-passe</label>
          <input id="pw" class="input" type="password" autocomplete="new-password">
          <p class="hint">Mínimo de 8 caracteres.</p>
        </div>
        <div class="field">
          <label class="label" for="pw2">Repita a palavra-passe</label>
          <input id="pw2" class="input" type="password" autocomplete="new-password">
        </div>
        <button id="enviar" class="btn btn-primary btn-block" type="submit">Guardar palavra-passe</button>
      </form>

      <div id="feito" class="auth-form" hidden>
        <div id="aviso" class="alert alert-ok" role="status"></div>
        <a class="btn btn-primary btn-block" href="login.html">Ir para o login</a>
      </div>
    </div>
  </main>

  <script type="module" src="js/pages/repor-password.js"></script>
</body>
</html>
