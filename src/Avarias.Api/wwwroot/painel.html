<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Painel · Gestão de Avarias</title>
  <link rel="icon" href="img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Montserrat:wght@600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page">
    <div class="page-head">
      <h1 class="page-title">Painel de avarias</h1>
      <a id="novo-link" class="btn btn-primary" href="novo-reporte.html" hidden>Registar avaria</a>
    </div>

    <section aria-label="Resumo por estado">
      <div id="contagens" class="counts"></div>
    </section>

    <section class="card" aria-label="Pesquisa e filtros">
      <div class="filters">
        <div class="field wide">
          <label class="label" for="q">Pesquisar</label>
          <input id="q" class="input" type="search" enterkeyhint="search" placeholder="Descrição, equipamento ou nº de série">
        </div>
        <div class="field">
          <label class="label" for="f-estado">Estado</label>
          <select id="f-estado" class="input"></select>
        </div>
        <div class="field">
          <label class="label" for="f-sala">Sala</label>
          <select id="f-sala" class="input"></select>
        </div>
        <div class="field">
          <label class="label" for="f-tipo">Tipo de equipamento</label>
          <select id="f-tipo" class="input"></select>
        </div>
        <div class="field">
          <button id="limpar" class="btn btn-secondary btn-block" type="button" disabled>Limpar filtros</button>
        </div>
      </div>
    </section>

    <div id="erro" role="alert"></div>

    <section aria-live="polite" class="stack">
      <h2 id="lista-titulo" class="section-title"></h2>
      <div id="lista"></div>
    </section>
  </main>

  <script type="module" src="js/pages/painel.js"></script>
</body>
</html>
